[package]
name = "oai-pmh"
version = "0.5.0"
edition = "2024"
authors = ["Mark Cooper <gh.aftermath967@passinbox.com>"]
description = "Rust library for the Open Archives Initiative Protocol for Metadata Harvesting"
license = "MIT OR Apache-2.0"

[dependencies]
quick-xml = { version = "0.39.2", features = ["serialize"] }
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_qs = "1.0.0"
url = "2.5.8"

[dev-dependencies]
mockito = "1.7.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
